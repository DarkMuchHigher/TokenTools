name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Smoke test binaries
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          "./target/release/tokentools$exe" --version
          "./target/release/tokentools$exe" --help > /dev/null

      - name: Install cargo-bundle-licenses
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo "$RUNNER_TEMP/cargo-bundle-licenses" \
            https://github.com/sstadick/cargo-bundle-licenses/releases/download/v4.2.0/cargo-bundle-licenses-linux-amd64
          chmod +x "$RUNNER_TEMP/cargo-bundle-licenses"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Collect third-party licenses
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

      - name: Upload third-party licenses
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v7
        with:
          name: thirdparty
          path: THIRDPARTY.yml
          retention-days: 14

      - name: Report runtime dependencies
        run: cargo run --release -p tokentools -- doctor

  package:
    name: Package (${{ matrix.artifact }})
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download third-party licenses
        uses: actions/download-artifact@v8
        with:
          name: thirdparty

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Prepare Linux archive
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          dir="dist/TokenTools-${{ matrix.artifact }}"
          mkdir -p "$dir"
          cp target/release/tokentools target/release/tokentools-gui README.md LICENSE THIRDPARTY.yml "$dir/"
          cp packaging/tokentools.desktop "$dir/"
          cp assets/app-icon.png "$dir/tokentools.png"
          tar -czf "dist/TokenTools-${{ matrix.artifact }}.tar.gz" \
            -C dist "TokenTools-${{ matrix.artifact }}"
          rm -rf "$dir"

      - name: Prepare Windows archive
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $dir = "dist/TokenTools-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/tokentools.exe, target/release/tokentools-gui.exe, README.md, LICENSE, THIRDPARTY.yml $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/TokenTools-${{ matrix.artifact }}.zip"
          Remove-Item -Recurse -Force $dir

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: TokenTools-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
