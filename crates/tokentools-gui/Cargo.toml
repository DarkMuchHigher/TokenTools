[package]
name = "tokentools-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
description = "GUI TokenTools: выгрузка контейнеров с Рутокена и снятие неэкспортируемости"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
pcsc-transport = { path = "../pcsc-transport" }
rutoken-fs = { path = "../rutoken-fs" }
cryptopro-container = { path = "../cryptopro-container" }
certfix = { path = "../certfix" }
